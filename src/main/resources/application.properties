spring.application.name=printbloom

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/printbloom_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Storage Configuration
printbloom.filestorage.upload-directory=uploads
printbloom.filestorage.max-file-size-bytes=26214400
printbloom.filestorage.allowed-file-types=application/pdf

# Spring Multipart Configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Razorpay Configuration (Placeholders)
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Printer Name as Configured in Windows
printbloom.printer.preferred-name=${PRINTER_NAME}
